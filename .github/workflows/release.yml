name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AudioMeter.sln

      - name: Build
        run: dotnet build AudioMeter.sln -c Release --no-restore

      - name: Test
        run: dotnet test AudioMeter.sln -c Release --no-build

      - name: Publish
        run: dotnet publish src/AudioMeter.App/AudioMeter.App.csproj -c Release --no-build -o publish

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath "AudioMeter-$env:VERSION-win.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioMeter-${{ env.VERSION }}-win
          path: AudioMeter-${{ env.VERSION }}-win.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:VERSION" "AudioMeter-$env:VERSION-win.zip" --target "${{ github.sha }}" --title "$env:VERSION" --generate-notes
